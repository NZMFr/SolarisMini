<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solaris Mini</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>.</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="stars"></canvas>
<div id="moonGlow"></div>
<div id="banner" class="banner hidden"></div>

<!-- ================= TOP BAR ================= -->
<header class="topbar">
  <div class="brand">
    <svg class="moon" viewBox="0 0 24 24" width="22" height="22"><defs>
      <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9aef0"/>
      </linearGradient></defs>
      <path fill="url(#mg)" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <span class="brand-name" id="brandName">Solaris Mini</span>
    <span class="coin-chip" title="Coins">
      <svg viewBox="0 0 24 24" width="13" height="13"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 7v10M9.2 9.5h4.2a1.8 1.8 0 0 1 0 3.6H9.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="coinCount">0</span>
    </span>
  </div>
  <div class="top-actions">
    <button id="notesBtn" class="icon-btn" title="Release notes">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>
    </button>
    <button id="settingsBtn" class="icon-btn" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5zm9.5 5.1c.02-.53.02-1.07 0-1.6l2-1.6-2-3.4-2.4 1a8.6 8.6 0 0 0-2.7-1.6L15.8 3h-4l-.4 2.6a8.6 8.6 0 0 0-2.7 1.6l-2.4-1-2 3.4 2 1.6a9.2 9.2 0 0 0 0 1.6l-2 1.6 2 3.4 2.4-1a8.6 8.6 0 0 0 2.7 1.6l.4 2.6h4l.4-2.6a8.6 8.6 0 0 0 2.7-1.6l2.4 1 2-3.4-2.1-1.6z"/></svg>
    </button>
    <button id="devBtn" class="icon-btn hidden" title="Developer board">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 5l-2 14"/></svg>
    </button>
  </div>
</header>

<main id="views">
  <section id="view-home" class="view"></section>
  <section id="view-chat" class="view hidden"></section>
  <section id="view-inbox" class="view hidden"></section>
  <section id="view-profile" class="view hidden"></section>
</main>

<!-- ================= BOTTOM PILL NAV ================= -->
<nav id="bottomNav">
  <button class="nav-seg active" data-view="home" title="Home">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </button>
  <button class="nav-seg" data-view="chat" title="Chat">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 0 1 7-11 8 8 0 0 1 8 8z"/></svg>
    <span>Chat</span>
  </button>
  <button class="nav-seg" data-view="inbox" title="Inbox">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    <span>Inbox</span>
  </button>
  <button class="nav-seg" data-view="profile" title="Profile">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
    <span>Profile</span>
  </button>
</nav>

<!-- ================= PLAYER ================= -->
<div id="player" class="player hidden">
  <div class="player-bar">
    <div class="player-title"><span id="playerName"></span><span id="playerMult" class="mult-chip hidden">2X XP + COINS</span></div>
    <div class="player-actions">
      <span class="player-clock">
        <svg viewBox="0 0 24 24" width="13" height="13"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span id="clockText">0s</span>
      </span>
      <button id="muteBtn" class="pbtn" title="Suspend audio">Mute</button>
      <button id="pipBtn" class="pbtn" title="Picture in picture">PiP</button>
      <button id="blankBtn" class="pbtn" title="Launch in about:blank">Blank tab</button>
      <button id="fsBtn" class="pbtn">Fullscreen</button>
      <button id="closeBtn" class="pbtn danger">Close</button>
    </div>
  </div>
  <iframe id="playerFrame" src="about:blank" allowfullscreen allow="autoplay; fullscreen; pointer-lock"
    sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms"></iframe>
</div>
<div id="pipWin" class="pip-win hidden">
  <div class="pip-bar" id="pipBar">
    <span id="pipTitle">Game</span>
    <button id="pipClose" class="pip-x" title="Close">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <iframe id="pipFrame" src="about:blank" allowfullscreen sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms"></iframe>
</div>

<!-- ================= MODALS ================= -->
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="games.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script src="social.js"></script>
<script src="admin.js"></script>
</body>
</html>
